# CI for the ai-business-operator project.
#
# NOTE: GitHub only runs workflows from the repository root `.github/workflows/`.
# While this project lives in a subdirectory, copy or symlink this file to the root
# (adjusting `defaults.run.working-directory`) or move the project to its own repo.
name: CI

on:
  push:
    paths: ['ai-business-operator/**']
  pull_request:
    paths: ['ai-business-operator/**']

defaults:
  run:
    working-directory: ai-business-operator

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend agents browser_agent vector_memory

      - name: Format check
        run: ruff format --check backend agents browser_agent vector_memory

      - name: Type check
        run: mypy backend/app
        continue-on-error: true # TODO(phase-2): drop once annotations are complete

      - name: Tests
        run: cd backend && python -m pytest -q

  security:
    name: Security — secrets, SAST, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan it

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static analysis
        run: |
          pip install bandit pip-audit
          bandit -r backend/app agents browser_agent vector_memory -ll

      - name: Dependency audit
        run: pip-audit --desc || true # advisory; do not block on an upstream CVE with no fix

  frontend:
    name: Frontend — types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business-operator/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ai-business-operator/backend
          push: false

      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: ai-business-operator
          file: ai-business-operator/agents/Dockerfile
          push: false
