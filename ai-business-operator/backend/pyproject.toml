[project]
name = "aibo-backend"
version = "0.1.0"
description = "AI Business Operator — API, orchestrator and systeme.io integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "anthropic>=0.40",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.17",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." for `app`, ".." for the sibling `agents` / `vector_memory` packages.
pythonpath = [".", ".."]

# Ruff is configured once, at the repository root (../ruff.toml), so every
# component lints identically. Do not add a [tool.ruff] section here.

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
