<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#fff; font-family: sans-serif; }
.scene { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.scene::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), rgba(0,0,0,0) 60%),
              radial-gradient(100% 100% at 50% 120%, rgba(90,60,40,.16), rgba(0,0,0,0) 65%);
  pointer-events:none;
}
#hero { width:1800px; height:1200px; background:#EDE3D7; }
#square { width:1200px; height:1200px; background:#EDE3D7; }

.sheet { background:#FDFBF7; box-shadow: 0 2px 6px rgba(60,40,25,.10), 0 34px 70px rgba(60,40,25,.24); }
.sheet img { display:block; width:100%; height:auto; }

/* hero: a stack of two sheets, front one straight-ish */
#hero .stack { position:relative; width:620px; }
#hero .back {
  position:absolute; top:26px; left:34px; width:100%; height:100%;
  transform: rotate(4deg); background:#F6EFE6;
  box-shadow: 0 22px 48px rgba(60,40,25,.20);
}
#hero .front { position:relative; transform: rotate(-2deg); }

/* square: tight crop on the top of the page so it reads at thumbnail size */
#square .crop {
  width:730px; height:800px; overflow:hidden; transform: rotate(-1.5deg);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 78%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 78%, rgba(0,0,0,0) 100%);
  box-shadow:none;
}
#square .crop img { width:100%; }
#square .sheetwrap { box-shadow: 0 2px 6px rgba(60,40,25,.10), 0 30px 60px rgba(60,40,25,.20); transform: rotate(-1.5deg); }
</style>

<div class="scene" id="hero">
  <div class="stack">
    <div class="back"></div>
    <div class="sheet front"><img src="checklist-page.png"></div>
  </div>
</div>

<div class="scene" id="square">
  <div class="crop"><img src="checklist-page.png"></div>
</div>
